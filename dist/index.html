<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f5f7f2">
<meta name="description" content="在层叠山水之间，自由前行。以一枚种子，开启一段无限旅程。"><title>山水无限 · 自在游</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232b4849'/%3E%3Cpath d='M4 24L12 9l6 10 4-7 7 12' fill='none' stroke='%23edf1e8' stroke-width='2'/%3E%3C/svg%3E">
<link rel="preload" href="fonts/ink-ui.woff2" as="font" type="font/woff2" crossorigin><link rel="stylesheet" href="style.css">
</head>
<body data-style="0">
<canvas id="landscape" aria-label="可游览的山水。左侧操控台可调整视角、画风和点景，也可使用上下方向键前后移动。"></canvas><div class="vignette"></div>
<header class="site-header"><div class="wordmark"><span class="seal" aria-hidden="true">自在</span><span>山水无限</span></div><p class="top-note">一水行舟 · 万山入画</p></header>
<main><div id="error" role="alert" hidden>当前浏览器无法显示山水。请启用硬件加速，或使用支持 WebGL 的浏览器重新打开。</div></main>
<aside class="console" id="console" aria-label="游览操控台">
 <div class="panel-heading"><h1>操控台</h1><button id="hide" class="icon-button" aria-label="关闭操控台" title="关闭操控台"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>
 <div class="panel-tabs" role="tablist" aria-label="操控台设置">
  <button id="tab-explore" role="tab" aria-selected="true" aria-controls="panel-explore" data-tab="explore">游览</button>
  <button id="tab-appearance" role="tab" aria-selected="false" aria-controls="panel-appearance" tabindex="-1" data-tab="appearance">画面</button>
  <button id="tab-scenery" role="tab" aria-selected="false" aria-controls="panel-scenery" tabindex="-1" data-tab="scenery">点景</button>
 </div>
 <div class="panel-body">
  <section id="panel-explore" class="tab-panel" role="tabpanel" aria-labelledby="tab-explore" tabindex="0">
   <section class="control-section" aria-labelledby="travel-title"><h2 id="travel-title">行进</h2>
    <div class="travel-controls"><button id="back" class="travel" aria-label="按住后退">后退</button><button id="forward" class="travel" aria-label="按住前进">前进</button><button id="auto" class="auto" aria-pressed="false"><span id="auto-symbol" aria-hidden="true">▷</span><span id="auto-text">自动前进</span></button></div>
    <p class="hint">按住前后移动，松开即停。</p>
    <div class="slider-field speed-row"><label for="speed">行进速度</label><output id="speed-value" for="speed">1.00×</output><input id="speed" type="range" min="0.25" max="3" step="0.25" value="1"></div>
   </section>
   <section class="control-section camera-section" aria-labelledby="camera-title"><h2 id="camera-title">观察视角</h2>
    <div class="slider-field camera-row"><label for="camera-height">观察高度</label><output id="camera-height-value" for="camera-height">16 米</output><input id="camera-height" type="range" min="3" max="80" step="1" value="16"></div>
    <div class="slider-field camera-row"><label for="camera-pitch">上下视角</label><output id="camera-pitch-value" for="camera-pitch">俯视 8°</output><input id="camera-pitch" type="range" min="-55" max="30" step="1" value="-8"></div>
    <button type="button" id="reset-camera" class="text-button">恢复默认视角</button>
   </section>
   <div class="panel-footer"><button id="reset" class="secondary-button">回到起点</button><p class="hint keyboard-hint">方向键前后移动 · 空格自动游览</p></div>
  </section>
  <section id="panel-appearance" class="tab-panel" role="tabpanel" aria-labelledby="tab-appearance" tabindex="0" hidden>
   <section class="control-section style-section" aria-labelledby="style-title"><h2 id="style-title">画风</h2>
    <div class="style-options"><button type="button" data-paint="0" aria-pressed="true"><span class="swatch song" aria-hidden="true"></span><span>宋画水墨</span></button><button type="button" data-paint="1" aria-pressed="false"><span class="swatch ink" aria-hidden="true"></span><span>宣纸写意</span></button><button type="button" data-paint="2" aria-pressed="false"><span class="swatch mineral" aria-hidden="true"></span><span>青绿山水</span></button><button type="button" data-paint="3" aria-pressed="false"><span class="swatch mist" aria-hidden="true"></span><span>雨雾实景</span></button></div>
    <p id="style-note" class="section-note">淡设色，细皴笔。近山有骨，远山入烟。</p>
   </section>
   <form id="seed-form" class="control-section"><label class="field-title" for="seed">山水种子</label><div class="seed-row"><input id="seed" value="山水无限" maxlength="64" autocomplete="off" spellcheck="false" placeholder="输入数字或文字" required><button type="submit" class="generate secondary-button">生成</button></div><p class="section-note">相同种子还原相同山水。生成后从起点开始。</p></form>
  </section>
  <section id="panel-scenery" class="tab-panel" role="tabpanel" aria-labelledby="tab-scenery" tabindex="0" hidden>
   <section class="control-section scenery-section" aria-labelledby="scenery-title"><h2 id="scenery-title">景致与生趣</h2><p class="section-note">点景沿途出现，可随时加入或移除。</p>
    <div class="scenery-options">
     <label><span>临水松树</span><input type="checkbox" role="switch" data-feature="pine" checked></label>
     <label><span>水上小舟</span><input type="checkbox" role="switch" data-feature="boat" checked></label>
     <label><span>山间亭子</span><input type="checkbox" role="switch" data-feature="pavilion" checked></label>
     <label><span>远处飞鸟</span><input type="checkbox" role="switch" data-feature="birds" checked></label>
     <label><span>流动雾气</span><input type="checkbox" role="switch" data-feature="fog" checked></label>
     <label><span>水面微澜</span><input type="checkbox" role="switch" data-feature="ripples" checked></label>
     <label class="wide"><span>山峡开合<small>由窄谷渐入开阔水面</small></span><input type="checkbox" role="switch" data-feature="openings" checked></label>
    </div>
    <div class="scenery-presets"><button type="button" id="pure" class="secondary-button">纯山水</button><button type="button" id="all-scenery" class="secondary-button">全部加入</button></div>
   </section>
  </section>
 </div>
</aside>
<button id="show" class="show-console" aria-controls="console" aria-expanded="true" hidden><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 7h16M4 17h16M9 4v6m6 4v6"/></svg><span>操控台</span></button>
<footer class="journey" aria-label="当前游览状态"><span id="style-label">宋画水墨</span><span class="divider" aria-hidden="true"></span><span id="status">静观山水</span><span class="divider" aria-hidden="true"></span><span class="distance-label">行程 <b id="distance">0</b> 米</span></footer>
<div id="announce" class="sr-only" role="status" aria-live="polite"></div><script src="solids.js"></script><script src="app.js"></script>
</body></html>

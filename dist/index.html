<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#e4e9e4"><meta name="description" content="在层叠山水之间，自由前行。以一枚种子，开启一段无限旅程。"><title>山水无限 · 自在游</title><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232b4849'/%3E%3Cpath d='M4 24L12 9l6 10 4-7 7 12' fill='none' stroke='%23edf1e8' stroke-width='2'/%3E%3C/svg%3E"><link rel="stylesheet" href="style.css"></head>
<body data-style="0"><canvas id="landscape" aria-label="沿河向远方延伸的山水，可在左侧操控台选择画风，或使用上下方向键前后移动"></canvas><div class="vignette"></div>
<header><div class="wordmark"><span class="seal">自在</span><span>山水无限</span></div><div class="top-note">一水行舟 · 万山入画</div></header>
<main><div class="poem" aria-hidden="true"><span>山水无限</span><small>行至水穷处，坐看云起时。</small></div><div id="error" role="alert" hidden>当前浏览器无法显示山水。请启用硬件加速，或使用支持 WebGL 的浏览器重新打开。</div></main>
<aside class="console" id="console" aria-label="游览操控台"><div class="panel-heading"><div><span class="eyebrow">自在游 / EXPLORE</span><h1>游览操控台</h1></div><button id="hide" class="icon-button" aria-label="关闭操控台" title="关闭操控台">×</button></div>
<fieldset class="style-section"><legend>画风</legend><div class="style-options"><button type="button" data-paint="0" aria-pressed="true"><span class="swatch song"></span><span>宋画水墨</span></button><button type="button" data-paint="1" aria-pressed="false"><span class="swatch ink"></span><span>宣纸写意</span></button><button type="button" data-paint="2" aria-pressed="false"><span class="swatch mineral"></span><span>青绿山水</span></button><button type="button" data-paint="3" aria-pressed="false"><span class="swatch mist"></span><span>雨雾实景</span></button></div><p id="style-note">淡设色，细皴笔。近山有骨，远山入烟。</p></fieldset>
<form id="seed-form"><label for="seed">山水种子</label><div class="seed-row"><input id="seed" value="山水无限" maxlength="64" autocomplete="off" spellcheck="false" placeholder="输入数字或文字" required><button type="submit" class="generate">生成山水</button></div></form>
<div class="travel-controls"><button id="back" class="travel" aria-label="按住后退"><span class="direction">↓</span> 后退</button><button id="forward" class="travel" aria-label="按住前进"><span class="direction">↑</span> 前进</button><button id="auto" class="auto" aria-pressed="false"><span id="auto-symbol">▷</span><span id="auto-text">自动前进</span></button></div>
<div class="speed-row"><label for="speed">行进速度</label><input id="speed" type="range" min="0.25" max="3" step="0.25" value="1"><output id="speed-value" for="speed">1.00×</output></div>
<details class="scenery-section" open><summary>景致与生趣 <span>自由增减</span></summary><div class="scenery-options">
<label><span>临水松树</span><input type="checkbox" data-feature="pine" checked></label>
<label><span>水上小舟</span><input type="checkbox" data-feature="boat" checked></label>
<label><span>山间亭子</span><input type="checkbox" data-feature="pavilion" checked></label>
<label><span>远处飞鸟</span><input type="checkbox" data-feature="birds" checked></label>
<label><span>流动雾气</span><input type="checkbox" data-feature="fog" checked></label>
<label><span>水面微澜</span><input type="checkbox" data-feature="ripples" checked></label>
<label class="wide"><span>山峡开合<small>沿途由窄谷渐入开阔水面</small></span><input type="checkbox" data-feature="openings" checked></label>
</div><div class="scenery-presets"><button type="button" id="pure">纯山水</button><button type="button" id="all-scenery">全部加入</button></div><p>点景沿途出现，开关不会重置行程。</p></details>
<div class="panel-footer"><span class="hint">按住前后移动 · 空格自动游览</span><button id="reset">回到起点</button></div></aside>
<button id="show" class="show-console" aria-controls="console" aria-expanded="true" hidden><span aria-hidden="true">☷</span>操控台</button><footer class="journey"><span id="style-label">宋画水墨</span><span class="divider"></span><span id="status">静观山水</span><span class="divider"></span><span>行程 <b id="distance">0</b> 米</span></footer><div id="announce" class="sr-only" role="status" aria-live="polite"></div><script src="app.js"></script></body></html>
